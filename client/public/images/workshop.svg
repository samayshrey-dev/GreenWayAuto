<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142026" />
      <stop offset="50%" stop-color="#1c2b31" />
      <stop offset="100%" stop-color="#0f191d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e9db4" />
      <stop offset="100%" stop-color="#327d94" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c5058" />
      <stop offset="50%" stop-color="#243339" />
      <stop offset="100%" stop-color="#182327" />
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fc8c2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#8fc8c2" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3c42" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Overhead LED Workshop Light Fixture -->
  <rect x="250" y="40" width="700" height="14" rx="3" fill="#3a4f56" />
  <rect x="260" y="46" width="680" height="4" rx="2" fill="#d2edea" filter="url(#glow)" />
  <polygon points="250,54 950,54 1100,750 100,750" fill="url(#lightBeam)" />

  <!-- Floor Horizon & Pit Line -->
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#364950" stroke-width="3" />
  <rect x="0" y="622" width="1200" height="178" fill="#131c20" />
  <line x1="0" y1="624" x2="1200" y2="624" stroke="#4e9db4" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Bay Demarcations -->
  <g opacity="0.6" font-family="'DM Mono', monospace" font-size="12" fill="#71868c" letter-spacing="2">
    <text x="60" y="655">BAY 03 // DIAGNOSTIC COMMAND</text>
    <text x="60" y="675">GREENWAY AUTO · AL QUOZ DUBAI</text>
    <text x="960" y="655">STATUS: READY</text>
    <text x="960" y="675">SYSTEMS: 8/8 VERIFIED</text>
  </g>

  <!-- Hydraulic Two-Post Lift Columns -->
  <!-- Left Post -->
  <rect x="310" y="120" width="36" height="500" rx="3" fill="url(#metalGrad)" stroke="#3f545c" stroke-width="1" />
  <rect x="320" y="160" width="16" height="420" fill="#192327" />
  <rect x="300" y="615" width="56" height="10" rx="2" fill="#465c64" />
  <!-- Left Lift Carriage & Arm -->
  <rect x="305" y="380" width="46" height="60" rx="4" fill="#327d94" />
  <polygon points="351,400 480,420 480,432 351,412" fill="#4e9db4" />

  <!-- Right Post -->
  <rect x="854" y="120" width="36" height="500" rx="3" fill="url(#metalGrad)" stroke="#3f545c" stroke-width="1" />
  <rect x="864" y="160" width="16" height="420" fill="#192327" />
  <rect x="844" y="615" width="56" height="10" rx="2" fill="#465c64" />
  <!-- Right Lift Carriage & Arm -->
  <rect x="849" y="380" width="46" height="60" rx="4" fill="#327d94" />
  <polygon points="849,400 720,420 720,432 849,412" fill="#4e9db4" />

  <!-- Elevated Vehicle Silhouette (Modern SUV / Range Rover Sport Profile) -->
  <g transform="translate(360, 240)">
    <!-- Shadow beneath chassis -->
    <ellipse cx="240" cy="185" rx="230" ry="16" fill="#080e10" opacity="0.7" />

    <!-- Vehicle Body Shell -->
    <path d="M 30,140
             C 45,110 80,105 110,105
             L 170,80
             C 210,50 310,48 370,52
             L 420,68
             C 460,78 480,110 490,140
             L 485,155
             C 475,160 460,160 440,145
             L 370,145
             C 360,165 325,165 315,145
             L 170,145
             C 160,165 125,165 115,145
             L 45,145
             Z"
          fill="#1c2c33" stroke="#48626c" stroke-width="2.5" />

    <!-- Roofline & Window Glass -->
    <path d="M 175,82 L 240,58 L 365,58 L 415,74 Z" fill="#293d45" stroke="#4e9db4" stroke-width="1" opacity="0.8" />
    <line x1="265" y1="58" x2="265" y2="82" stroke="#1c2c33" stroke-width="3" />
    <line x1="340" y1="58" x2="340" y2="80" stroke="#1c2c33" stroke-width="3" />

    <!-- Headlight & Tail Glow -->
    <polygon points="30,132 45,130 42,138 28,138" fill="#4e9db4" filter="url(#glow)" />
    <polygon points="485,132 494,134 492,142 483,140" fill="#bb625b" filter="url(#glow)" />

    <!-- Front Wheel Assembly -->
    <circle cx="142" cy="148" r="32" fill="#131b1e" stroke="#374b52" stroke-width="3" />
    <circle cx="142" cy="148" r="22" fill="#202c31" />
    <circle cx="142" cy="148" r="8" fill="#4e9db4" />
    <!-- Brembo Caliper -->
    <rect x="156" y="136" width="7" height="18" rx="2" fill="#c38b47" />

    <!-- Rear Wheel Assembly -->
    <circle cx="342" cy="148" r="32" fill="#131b1e" stroke="#374b52" stroke-width="3" />
    <circle cx="342" cy="148" r="22" fill="#202c31" />
    <circle cx="342" cy="148" r="8" fill="#4e9db4" />
  </g>

  <!-- Floating Digital Diagnostic Telemetry HUD -->
  <g transform="translate(130, 200)">
    <!-- Glass Panel Backdrop -->
    <rect width="180" height="110" rx="6" fill="#172327" fill-opacity="0.85" stroke="#3b5258" stroke-width="1" filter="url(#glow)" />
    <text x="16" y="28" font-family="'DM Mono', monospace" font-size="9" fill="#8fc8c2" letter-spacing="1">BRAKE PAD WEAR</text>
    <text x="16" y="54" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff">3.2 mm</text>
    <rect x="16" y="66" width="148" height="4" rx="2" fill="#2a3a40" />
    <rect x="16" y="66" width="38" height="4" rx="2" fill="#c38b47" />
    <text x="16" y="90" font-family="'DM Sans', sans-serif" font-size="9" fill="#889da2">Reorder required · Brembo P85120</text>
  </g>

  <g transform="translate(890, 220)">
    <rect width="180" height="96" rx="6" fill="#172327" fill-opacity="0.85" stroke="#3b5258" stroke-width="1" filter="url(#glow)" />
    <text x="16" y="28" font-family="'DM Mono', monospace" font-size="9" fill="#4c9b79" letter-spacing="1">PRESSURE CHECK</text>
    <text x="16" y="54" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff">34.5 PSI</text>
    <text x="16" y="78" font-family="'DM Sans', sans-serif" font-size="9" fill="#4c9b79">● All 4 sensors calibrated</text>
  </g>

  <!-- Workshop Floor Tool Chest & Digital Terminal -->
  <rect x="140" y="510" width="110" height="110" rx="3" fill="#202e33" stroke="#364950" stroke-width="1" />
  <line x1="140" y1="535" x2="250" y2="535" stroke="#162024" stroke-width="2" />
  <line x1="140" y1="560" x2="250" y2="560" stroke="#162024" stroke-width="2" />
  <line x1="140" y1="585" x2="250" y2="585" stroke="#162024" stroke-width="2" />
  <rect x="180" y="520" width="30" height="4" rx="1" fill="#4e9db4" />
  <rect x="180" y="545" width="30" height="4" rx="1" fill="#4e9db4" />
  <rect x="180" y="570" width="30" height="4" rx="1" fill="#4e9db4" />
  <rect x="180" y="595" width="30" height="4" rx="1" fill="#4e9db4" />

  <!-- Mobile Diagnostic Tablet on Tool Stand -->
  <rect x="970" y="470" width="80" height="150" fill="none" stroke="#2a3a40" stroke-width="3" />
  <rect x="955" y="440" width="110" height="70" rx="4" fill="#1b282e" stroke="#4e9db4" stroke-width="1.5" />
  <rect x="965" y="450" width="90" height="50" fill="#121c20" />
  <line x1="970" y1="465" x2="1045" y2="465" stroke="#4c9b79" stroke-width="1" />
  <line x1="970" y1="475" x2="1025" y2="475" stroke="#4e9db4" stroke-width="1" />
  <line x1="970" y1="485" x2="1010" y2="485" stroke="#c38b47" stroke-width="1" />
</svg>
